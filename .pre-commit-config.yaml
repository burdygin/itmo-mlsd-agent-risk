minimum_pre_commit_version: "4.7.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: prettier
        name: prettier (Markdown, YAML, JSON)
        entry: npm run format:check --
        language: system
        pass_filenames: false
        always_run: true
      - id: markdownlint
        name: markdownlint (all Markdown)
        entry: npm run lint --
        language: system
        pass_filenames: false
        always_run: true
